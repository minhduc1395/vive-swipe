name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # W032: e2e ma trận Chromium (pixel-7) và WebKit (iphone-13). Mỗi project chạy trên server dev mới.
  e2e:
    runs-on: ubuntu-latest
    needs: kiem-tra
    strategy:
      fail-fast: false
      matrix:
        project: [pixel-7, iphone-13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cài trình duyệt Playwright
        run: npx playwright install --with-deps ${{ matrix.project == 'iphone-13' && 'webkit' || 'chromium' }}
      - name: Playwright ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: "true"
      - name: Tải kết quả khi hỏng
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7
