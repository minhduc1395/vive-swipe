<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>VIVE Quẹt – Danh mục sản phẩm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Be Vietnam Pro', sans-serif; color: #2B2B2A; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex-grow: 1; min-height: 0; overflow-y: auto">
    <header style="padding: 24px 20px 0 20px; display: flex; align-items: center; gap: 4px">
      <sc-if value="{{listMode}}" hint-placeholder-val="{{false}}">
        <button type="button" onClick="{{reset}}" aria-label="Về tất cả danh mục" style="width: 44px; height: 44px; margin-left: -12px; border: none; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2B2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </sc-if>
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.4px">{{title}}</h1>
      <sc-if value="{{listMode}}" hint-placeholder-val="{{false}}">
        <span style="margin-left: 6px; font-size: 14px; color: #737373">{{total}} món</span>
      </sc-if>
    </header>

    <div style="padding: 12px 20px 0 20px">
      <div style="height: 48px; box-sizing: border-box; border-radius: 14px; background: #F7EEEB; display: flex; align-items: center; gap: 10px; padding: 0 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5C5B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <label for="tim-sp" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tìm sản phẩm</label>
        <input id="tim-sp" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Tìm tên, thương hiệu, thành phần" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #2B2B2A">
      </div>
    </div>

    <sc-if value="{{landing}}" hint-placeholder-val="{{true}}">
      <section style="padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Loại sản phẩm</h2>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{cats}}" as="c" hint-placeholder-count="12">
            <button type="button" onClick="{{c.pick}}" style="{{c.style}}">
              <span style="font-size: 14px; font-weight: 600; line-height: 1.25">{{c.label}}</span>
              <span style="font-size: 12px; color: #5C5C5B">{{c.count}} món</span>
            </button>
          </sc-for>
        </div>
      </section>

      <section style="padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Theo vấn đề da</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{concerns}}" as="v" hint-placeholder-count="6">
            <button type="button" onClick="{{v.pick}}" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #E8D2CC; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #2B2B2A; cursor: pointer">{{v.label}}</button>
          </sc-for>
        </div>
      </section>

      <section style="padding: 20px 0 20px 20px; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Thương hiệu</h2>
        <div style="display: flex; gap: 8px; overflow-x: auto; padding-right: 20px">
          <sc-for list="{{brands}}" as="b" hint-placeholder-count="6">
            <button type="button" onClick="{{b.pick}}" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #E8D2CC; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; color: #2B2B2A; cursor: pointer">{{b.label}}</button>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{listMode}}" hint-placeholder-val="{{false}}">
      <div style="padding: 14px 0 0 20px; display: flex; gap: 8px; overflow-x: auto" role="group" aria-label="Chọn loại sản phẩm">
        <sc-for list="{{catChips}}" as="c" hint-placeholder-count="6">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
        <span style="flex-shrink: 0; width: 12px"></span>
      </div>
      <div style="padding: 12px 20px 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
        <div style="display: flex; gap: 6px; overflow-x: auto; min-width: 0" role="group" aria-label="Lọc theo vấn đề da">
          <sc-for list="{{concernChips}}" as="v" hint-placeholder-count="3">
            <button type="button" onClick="{{v.pick}}" aria-pressed="{{v.pressed}}" style="{{v.style}}">{{v.label}}</button>
          </sc-for>
        </div>
        <label style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; font-size: 13px; color: #737373">
          <span>Xếp</span>
          <select value="{{sort}}" onChange="{{onSort}}" style="height: 34px; border-radius: 10px; border: 1px solid #E8D2CC; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #2B2B2A; padding: 0 6px">
            <option value="goi-y">Gợi ý</option>
            <option value="giam">Đang giảm giá</option>
            <option value="gia-tang">Giá thấp trước</option>
            <option value="gia-giam">Giá cao trước</option>
          </select>
        </label>
      </div>

      <div style="padding: 14px 16px 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
          <article style="display: flex; flex-direction: column; gap: 5px">
            <div style="position: relative; height: 150px; border-radius: 18px; background: {{it.bg}}; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{it.hasImg}}" hint-placeholder-val="{{false}}">
                <img src="{{it.img}}" alt="{{it.name}}" style="width: 126px; height: 126px; object-fit: contain">
              </sc-if>
              <sc-if value="{{it.noImg}}" hint-placeholder-val="{{true}}">
                <span role="img" aria-label="Ảnh sản phẩm chờ bổ sung" style="font-size: 11px; font-weight: 600; letter-spacing: 1.4px; color: #5C5C5B">{{it.ph}}</span>
              </sc-if>
              <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{false}}">
                <span style="position: absolute; left: 8px; top: 8px; height: 24px; padding: 0 8px; border-radius: 8px; background: #2B2B2A; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center">{{it.badge}}</span>
              </sc-if>
              <button type="button" onClick="{{it.toggleLike}}" aria-label="Thích" aria-pressed="{{it.likedPressed}}" style="position: absolute; top: 6px; right: 6px; width: 38px; height: 38px; border-radius: 999px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="{{it.heartFill}}" stroke="#2B2B2A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              </button>
            </div>
            <span style="font-size: 11px; font-weight: 600; letter-spacing: 1.2px; color: #737373">{{it.brandCaps}}</span>
            <span style="font-size: 14px; line-height: 1.35; font-weight: 500; height: 38px; overflow: hidden">{{it.name}}</span>
            <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 6px">
              <div style="display: flex; flex-direction: column; min-width: 0">
                <span style="display: flex; align-items: baseline; gap: 6px"><strong style="font-size: 16px; font-weight: 700">{{it.price}}</strong><sc-if value="{{it.hasOld}}" hint-placeholder-val="{{false}}"><s style="font-size: 12px; color: #737373">{{it.old}}</s></sc-if></span>
                <span style="font-size: 11px; color: #737373; height: 15px">{{it.note}}</span>
              </div>
              <a href="Gio.dc.html" aria-label="Thêm vào giỏ" style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 999px; background: #CFE3D5; display: flex; align-items: center; justify-content: center">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2B2A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </a>
            </div>
          </article>
        </sc-for>
      </div>
      <sc-if value="{{hasMore}}" hint-placeholder-val="{{false}}">
        <div style="padding: 16px 20px 0 20px">
          <button type="button" onClick="{{more}}" style="width: 100%; height: 48px; border-radius: 999px; border: 1.5px solid #2B2B2A; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #2B2B2A; cursor: pointer">Xem thêm {{moreCount}} sản phẩm</button>
        </div>
      </sc-if>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
        <p style="margin: 28px 20px 0 20px; text-align: center; font-size: 14px; line-height: 1.5; color: #737373">Chưa có sản phẩm hợp bộ lọc này. Thử bỏ bớt bộ lọc hoặc tìm từ khác.</p>
      </sc-if>
      <div style="height: 20px"></div>
    </sc-if>
  </div>

  <nav aria-label="Điều hướng chính" style="flex-shrink: 0; height: 76px; box-sizing: border-box; padding: 8px 4px 14px 4px; border-top: 1px solid #F2E4E0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF">
    <a href="Quet.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; color: #737373">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="13" height="17" rx="2.5"/><path d="M4 7v12a2 2 0 0 0 2 2h9"/></svg>Quẹt
    </a>
    <a href="DanhMuc.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: #2B2B2A">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2B2A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Danh mục
    </a>
    <a href="DaThich.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; color: #737373">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>Đã thích
    </a>
    <a href="Deal.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; color: #737373">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><path d="M7 7h.01"/></svg>Deal
    </a>
    <a href="Gio.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; color: #737373">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Giỏ
    </a>
  </nav>
</div>
</x-dc>

    if (listMode) {
      if (q) title = 'Kết quả tìm';
      else if (s.cat) title = CATS.find((c) => c[0] === s.cat)[1];
      else if (s.brand) title = s.brand;
      else if (s.van) title = CONCERNS.find((c) => c[0] === s.van)[1];
    }
    return {
      title, listMode, landing: !listMode, total: found.length,
      cats, concerns, brands, catChips, concernChips, items,
      hasMore: found.length > s.limit, moreCount: found.length - s.limit, empty: found.length === 0,
      q: s.q, sort: s.sort,
      onQ: (e) => this.setState({ q: e.target.value, limit: 6 }),
      onSort: (e) => this.setState({ sort: e.target.value }),
      more: () => this.setState({ limit: s.limit + 6 }),
      reset: () => this.go({ cat: '', brand: '', van: '', q: '' })
    };
  }
}
</script>
