<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>VIVE Quẹt – Câu hỏi mối quan tâm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@1,400;1,600&amp;display=swap">
<style>
body{margin:0}
a{color:#2B2B2A}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Be Vietnam Pro', sans-serif; color: #2B2B2A; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 12px; padding: 20px 16px 8px 8px">
    <a href="Main.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2B2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" role="img" aria-label="Câu 2 trên 3">
      <div style="height: 4px; border-radius: 4px; background: #2B2B2A"></div>
      <div style="height: 4px; border-radius: 4px; background: #2B2B2A"></div>
      <div style="height: 4px; border-radius: 4px; background: #F7EEEB"></div>
    </div>
    <a href="Quet.dc.html" style="font-size: 15px; font-weight: 500; text-decoration: none; padding: 10px 4px">Bỏ qua</a>
  </header>

  <main style="padding: 20px 24px 0 24px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 1.2px; color: #737373">CÂU 2/3</span>
    <h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 600">Bạn quan tâm <span style="font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600">điều gì?</span></h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #737373">Chọn tối đa 3. VIVE dùng để xếp sản phẩm hợp với bạn lên trước.</p>
  </main>

  <div style="padding: 24px 24px 0 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="10">
      <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">
        <span>{{c.label}}</span>
        <sc-if value="{{c.on}}" hint-placeholder-val="{{false}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2B2A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="padding: 14px 24px 0 24px; font-size: 14px; color: #737373">{{counter}}</div>

  <footer style="margin-top: auto; padding: 16px 24px 32px 24px">
    <a href="Quet.dc.html" style="width: 100%; height: 56px; box-sizing: border-box; border-radius: 999px; background: #2B2B2A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px">Tiếp tục</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: ['lo-chan-long', 'cap-am'], full: false };
  }
  toggle(id) {
    const p = this.state.picked;
    if (p.indexOf(id) >= 0) {
      this.setState({ picked: p.filter((x) => x !== id), full: false });
    } else if (p.length < 3) {
      this.setState({ picked: p.concat([id]), full: false });
    } else {
      this.setState({ full: true });
    }
  }
  renderVals() {
    const all = [
      ['mun', 'Mụn'], ['lo-chan-long', 'Lỗ chân lông'], ['sang-da', 'Thâm, sáng da'], ['cap-am', 'Cấp ẩm'],
      ['lam-diu', 'Làm dịu'], ['chong-lao-hoa', 'Chống lão hóa'], ['chong-nang', 'Chống nắng'], ['trang-diem', 'Trang điểm'],
      ['co-the', 'Chăm sóc cơ thể'], ['thiet-bi', 'Thiết bị làm đẹp']
    ];
    const base = 'height: 52px; box-sizing: border-box; border-radius: 16px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: inherit; font-size: 15px; font-weight: 500; color: #2B2B2A; cursor: pointer; text-align: left; ';
    const chips = all.map(([id, label]) => {
      const on = this.state.picked.indexOf(id) >= 0;
      return {
        id, label, on, pressed: on ? 'true' : 'false',
        style: base + (on ? 'background: #E8D2CC; border: 1.5px solid #2B2B2A;' : 'background: #FFFFFF; border: 1.5px solid #E8D2CC;'),
        pick: () => this.toggle(id)
      };
    });
    const n = this.state.picked.length;
    return {
      chips,
      counter: this.state.full ? 'Đã đủ 3 lựa chọn. Bỏ bớt một mục để đổi.' : 'Đã chọn ' + n + '/3'
    };
  }
}
</script>
</body>
</html>
