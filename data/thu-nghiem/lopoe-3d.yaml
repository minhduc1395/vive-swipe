# Khối cuộn 3D LOPOE: khối 2 trang chủ `/` (W055) và trang thử /thu-nghiem/lopoe-3d (W054).
# Đổi chữ / mốc ở đây, không sửa code. Mốc a, b là tiến trình cuộn (0 → 1) của đoạn dính.
# tu_khoa: "|" = chỗ xuống dòng có chủ đích (dòng 2 tô xanh, lùi vào).
# nhan_dau: số chữ đầu tô xanh (khi không có "|"); nhan_tu: tô xanh từ chữ thứ mấy.
# cau: *chữ* = nghiêng Playfair.
# cho_duyet: true = câu cần bằng chứng (Luật Quảng cáo). Chỉ hiện khi có huy_hieu (bằng chứng CĐT gửi)
#   hoặc khi hien_cho_duyet: true (chỉ dùng ở trang thử để duyệt).
# huy_hieu: ảnh huy hiệu gốc của nhãn, CHỈ gắn vào đúng sản phẩm được trao giải.
hien_cho_duyet: false
# Ảnh thật tách nền từ kho media (LOPOE-CF/AMP/CR tach-nen.png, QA duyệt 18/11), làm sạch viền 20/11.
# Ampoule tách 2 mảnh cùng bề rộng để nhấc nắp nhỏ giọt. Mô hình glb tạm đã bỏ (CĐT 20/11: chưa giống thật).
tai_san:
  ampoule_than: /thu-nghiem/lopoe-3d/ampoule-than.webp
  ampoule_nap: /thu-nghiem/lopoe-3d/ampoule-nap.webp
  ampoule_co: /thu-nghiem/lopoe-3d/ampoule-co.webp
  sua_rua_mat: /thu-nghiem/lopoe-3d/srm.webp
  kem_duong: /thu-nghiem/lopoe-3d/kem.webp
mo_dau:
  nho: "Mới tại VIVE"
  tieu_de: "LOPOE Better Balance"
  cau: "Bọt dày. Cấp ẩm. *Làm dịu.*"
  nut:
    - { chu: "Mua", den: "/danh-muc?thuong-hieu=LOPOE" }
    - { chu: "Tìm hiểu thêm", den: "/new-arrival" }
khoi:
  - id: srm-cong-dung
    a: 0.075
    b: 0.155
    vi_tri: phai
    tu: phai
    ten_nho: "Sữa rửa mặt"
    tu_khoa: "pH 5.5"
    nhan_tu: 1
    co: lon
    cau: "Sạch sâu. *Không căng rít.*"
    chips: ["Bọt đệm siêu mịn", "Êm cho da nhạy cảm"]
  - id: srm-thanh-phan
    a: 0.185
    b: 0.27
    vi_tri: tren-trai
    tu: tren
    ten_nho: "Sữa rửa mặt"
    tu_khoa: "4 thành phần|xanh"
    cau: "Cấp ẩm & *phục hồi.*"
  # 19/11 chỗ này là "Winner · Hwahae Beauty Awards 2025" + vòng lá. 20/11 CĐT bỏ vòng lá.
  # Huy hiệu Hwahae CĐT gửi là của Ampoule (đặt ở amp-giai-thuong), chưa có bằng chứng giải cho sữa rửa mặt.
  - id: srm-diu-nhe
    a: 0.30
    b: 0.37
    vi_tri: trai
    tu: trai
    ten_nho: "Sữa rửa mặt"
    tu_khoa: "Sạch|không khô"
    co: lon
    cau: "*Rửa xong vẫn mềm.*"
    cau_lon: true
  - id: amp-cong-dung
    a: 0.42
    b: 0.50
    vi_tri: trai
    tu: duoi
    ten_nho: "Ampoule"
    tu_khoa: "Cấp ẩm|cân bằng"
    cau: "*Dịu da tức thì.*"
    cau_lon: true
  - id: amp-thanh-phan
    a: 0.53
    b: 0.62
    vi_tri: cot
    tu: phai
    ten_nho: "Ampoule"
    tu_khoa: "4 hoạt chất"
    nhan_tu: 1
    cau: "Phục hồi & *khóa ẩm.*"
  # Bằng chứng: huy hiệu "2025 상반기 hwahae awards · 라이징 트렌드 | 진정 · 1위 · 에센스/앰플/세럼" (CĐT gửi 20/11)
  - id: amp-giai-thuong
    a: 0.65
    b: 0.72
    vi_tri: duoi-giua
    tu: duoi
    huy_hieu:
      anh: /chien-dich/lopoe-better-balance/hwahae-awards-2025-h1.webp
      mo_ta: "Huy hiệu Hwahae Awards nửa đầu 2025, hạng 1 Xu hướng nổi bật, nhóm Làm dịu, Essence/Ampoule/Serum"
    tu_khoa: "Hwahae Awards 2025"
    nhan_dau: 1
    cau: "Hạng 1 *Ampoule làm dịu*"
    cho_duyet: true
  - id: kem-cong-dung
    a: 0.78
    b: 0.87
    vi_tri: trai-duoi
    tu: trai
    ten_nho: "Kem dưỡng"
    tu_khoa: "Sẵn sàng|trang điểm"
    cau: "*Ready for makeup.*"
    cau_lon: true
  # Kết: bộ 3 đứng lại, mời xem combo rồi nhả sang khối sau
  - id: ket
    a: 0.93
    b: 1
    vi_tri: tren-giua
    tu: duoi
    ten_nho: "Bộ 3 LOPOE"
    tu_khoa: "Better Balance"
    nhan_tu: 1
    nut:
      - { chu: "Xem combo", den: "#combo-lopoe-bo3" }
      - { chu: "Mua", den: "/danh-muc?thuong-hieu=LOPOE" }
