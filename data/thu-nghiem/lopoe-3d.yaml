# DES-004 (QD-DES-001): ảnh thành phần DES dựng, nền trong; Hyaluronic Acid (xoan) chưa có ảnh nên giữ 3D
anh_thanh_phan:
  thua: /thanh-phan/thanh-phan-cay-thua-xanh.webp
  sen: /thanh-phan/thanh-phan-sen-xanh.webp
  phan-tu: /thanh-phan/thanh-phan-b5-panthenol.webp
  rau-ma: /thanh-phan/thanh-phan-rau-ma.webp
so_1: "No.1"   # chữ lớn sau ampoule ở phần giải thưởng, chỉ hiện khi khối amp-giai-thuong hiện
# W072 (#126): bố cục "bọt nước" cho đoạn 4 hoạt chất ampoule (BOD chọn hướng, WEB-020). Công tắc: bat: true,
# hoặc thêm ?bot-nuoc=1 vào URL để xem trước. Tắt thì đoạn giữ như cũ. Ảnh bọt DES (DES-010 bản v1), thay ảnh thì giữ tên file.
# Ghép bọt với hoạt chất theo `loai` trong thanh_phan.ampoule. Chữ bọt lấy từ thanh_phan.ampoule; 2 nút lấy từ khối `ket`.
bot_nuoc:
  bat: false
  anh:
    thua: /thanh-phan/bot-nuoc-la-thua.webp
    sen: /thanh-phan/bot-nuoc-sen-xanh.webp
    xoan: /thanh-phan/bot-nuoc-hyaluronic-acid.webp
    phan-tu: /thanh-phan/bot-nuoc-panthenol-niacinamide.webp
  may_tinh:
    tam: [29, 50]          # % khung nhìn: chỗ chai ampoule đứng cuối đoạn (x = (1 - 0.42) / 2)
    ban_kinh: [34, 42]     # min(34vw, 42vh)
    goc: [-50, -16.7, 16.7, 50]
    co: [13, 20]           # min(13vw, 20vh)
  dien_thoai:
    tren: 57               # % chiều cao: lưới 2×2 bắt đầu dưới đáy chai
    duoi: 72               # px chừa cho thanh tab dưới (64px)
    co: [22, 8.5]          # min(22vw, 8.5vh)
