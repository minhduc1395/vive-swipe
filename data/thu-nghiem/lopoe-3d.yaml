# Khối cuộn 3D LOPOE (W054) — trang thử nghiệm /thu-nghiem/lopoe-3d
# Đổi chữ / mốc ở đây, không sửa code. Mốc a, b là tiến trình cuộn (0 → 1) của đoạn dính.
# tu_khoa: "|" = chỗ xuống dòng có chủ đích (dòng 2 tô xanh, lùi vào).
# nhan_dau: số chữ đầu tô xanh (khi không có "|"); nhan_tu: tô xanh từ chữ thứ mấy.
# cau: *chữ* = nghiêng Playfair.
# cho_duyet: true = câu cần bằng chứng (Luật Quảng cáo), chỉ hiện khi hien_cho_duyet: true.
hien_cho_duyet: true   # trang thử nghiệm: hiện để duyệt. Khi gắn vào landing thật: false cho tới khi có chứng nhận Hwahae
tai_san:
