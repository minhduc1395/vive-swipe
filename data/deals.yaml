# VIVE: danh sách deal cho web quẹt sản phẩm
# Nguồn: project Claude "VIVE pop up"
#   - claude/VIVE-LOPOE-chuong-trinh-da-chot.md (bản rút gọn 3 ưu đãi, 20/11/2026, QD-SALE-012)
#   - claude/VIVE-khuyen-mai-tong-hop.md (cập nhật 20/11/2026)
#   - claude/VIVE-popup-huong-dan-chung.md mục 6
# Soạn: Claude, 15/11/2026. Chỉ Claude hoặc chủ dự án sửa file này (đổi luật thì tạo handoff thay-doi-luat).
#
# QUY TẮC HIỂN THỊ (bắt buộc, có unit test):
#   Web chỉ hiện deal khi: trang_thai in [DANG_CHAY, DA_DUYET]
#                          AND hien_thi == true
#                          AND (may_rui == false OR da_dang_ky == true)   # da_dang_ky = được phép chạy (đã đăng ký, hoặc BOD quyết không cần đăng ký: QD-DIR-018)
#                          AND hôm nay nằm trong [bat_dau, ket_thuc]
#   Deal ĐỀ XUẤT không có trong file này (KM-01, KM-06, bậc hóa đơn 200K/300K/400K, CB-01 đến CB-06).
#
# Giá trên web là giá ƯỚC TÍNH. Giá và quà cuối cùng do nhân viên xác nhận trên POS tại quầy.
# "Số lượng có hạn" chỉ ghi khi gioi_han có số thật. Không hiện số suất còn lại nếu không có dữ liệu thật.
#
# Loại (loai):
#   giam_khi_mua_kem      : giá ưu đãi cho sản phẩm A khi hóa đơn có sản phẩm khác
#   combo                 : bộ sản phẩm có giá riêng
#   qua_theo_nguong_nhan  : tổng tiền của một nhóm nhãn đạt mốc thì tặng quà
#   qua_theo_nguong_don   : tổng hóa đơn đạt mốc thì tặng quà
#   qua_khi_mua           : mua sản phẩm/combo cụ thể thì tặng quà
#   mua_x_tang_y          : mua X món tặng Y món
#   khong_can_mua         : quà không cần mua hàng
#
# Quy tắc cộng dồn (chương trình đã chốt mục 5):
#   - Mỗi hóa đơn nhận 1 quà theo hóa đơn (nhom_qua: hoa_don), chọn dòng có lợi nhất cho khách.
#   - Cộng thêm được: LOPOE-25 (trừ combo LOPOE và KM-10), túi sample, voucher nhà hàng (KM-09).

thoi_gian_mac_dinh: &popup
  bat_dau: 2026-11-14
  ket_thuc: 2026-11-29   # ngày cuối pop-up theo caption đã đăng, chưa chốt chính thức

